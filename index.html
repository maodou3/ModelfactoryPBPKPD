if(page==='library')html=head('学习资源库','书籍、文献、视频与内部学习记录，都连接到一个明确的学习目标。',`<button class="btn primary" onclick="addResource()">＋ 添加资源</button>`)+`<div class="toolbar"><input aria-label="搜索资源" placeholder="搜索标题、主题或工具…" value="${esc(search)}" oninput="search=this.value;resourceList()"><select aria-label="资源类型" onchange="filter=this.value;resourceList()">${['全部','书籍','文献','视频','指南','文档','SOP','case study'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="exportData()">导出学习备份</button><button class="btn" onclick="document.getElementById('import').click()">导入备份</button><input hidden type="file" id="import" accept="application/json" onchange="importData(this)"></div><div id="resources"></div><p class="tiny">官方入口供你检索与核对，未声称完成内容审阅。新增资源可记录具体版本、链接和笔记。</p>`;
if(page==='gap')html=head('岗位要求 × 我的经验','基于你的 NCA、PKPD、TIM / PBPK 与药企文档经历建立起点；评分由你确认。')+`<div class="card"><div class="row"><h2>目标岗位</h2><select aria-label="目标岗位" onchange="state.role=this.value;save();render()">${['Senior Pharmacometrician','PK scientist','Clinical Pharmacology Associate Director','PBPK Scientist','systems pharmacology Scientist'].map(r=>`<option ${state.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="profile">已有经验线索：NCA 与 PKPD 分析、TIM 相关工作、CPAP / CSR 和 SOP 接触、大型药企协作。以下为自评工具，不是能力认证或真实 JD 的自动评分。</div><div class="tablewrap"><table><tr><th>能力维度</th><th>当前自评</th><th>目标建议</th><th>补齐证据的行动</th></tr>${['NCA / Phoenix WinNonlin','PopPK / NONMEM','PBPK / 转化外推','R / MATLAB 可复现分析','CPAP / CSR / ICH GCP','MIDD 决策与项目 leadership'].map((s,i)=>{let target=state.role.includes('Director')?4:state.role.includes('PBPK')&&i===2?4:state.role.includes('Pharmaco')&&i===1?4:3;return `<tr><td><b>${s}</b></td><td><select aria-label="${s} 自评" onchange="state.levels[${i}]=+this.value;save();render()">${['待评估','1 · 理解概念','2 · 指导下实践','3 · 独立交付','4 · 带领与审阅'].map((x,k)=>`<option value="${k}" ${+(state.levels[i]||0)===k?'selected':''}>${x}</option>`).join('')}</select></td><td>${target} / 4${state.levels[i]?`<div class="tiny">差距 ${Math.max(0,target-state.levels[i])} 级</div>`:''}</td><td>${['提交 NCA 分析包并写 QC 记录','完成模型、诊断和剂量模拟报告','整理验证数据、参数来源与敏感性','交付脚本、依赖记录与结果复现说明','用自建模板写方法与结果并模拟 review','用案例做决策备忘录，讲清风险与推荐'][i]}</td></tr>`}).join('')}</table></div><h3 style="margin-top:20px">我的目标 JD 与经验依据</h3><textarea aria-label="岗位要求与经验笔记" placeholder="粘贴岗位要求，记录现有证据、缺口和下一步行动…" oninput="state.notes.jd=this.value;save()">${esc(state.notes.jd||'')}</textarea></div>`;
if(page==='plan')html=head('每周学习计划','用一个可交付的结果，定义这一周的进步。',`<button class="btn primary" onclick="addTask()">＋ 添加任务</button>`)+`<div class="card"><div class="row"><h2>本周行动清单</h2><label>每周投入 <input aria-label="每周学习小时" style="width:75px" type="number" min="1" max="100" value="${state.hours}" onchange="state.hours=Math.max(1,Math.min(100,+this.value||20));save()"> 小时</label></div>${[...tasks,...state.tasks].map(task).join('')}</div><h2 style="margin-top:28px">3 周集中学习 · 可按节奏调整</h2><div class="week">${[['01','补齐分析基础','NCA / 数据 QC / R','交付：带 QC 的 NCA 分析包'],['02','完成一个建模闭环','PopPK / PKPD / PBPK','交付：模型诊断与预测报告'],['03','练习科学决策与表达','MIDD / CPAP / CSR / 面试','交付：决策备忘录与 10 分钟汇报']].map(r=>`<div class="card"><span class="eyebrow">WEEK ${r[0]}</span><h3>${r[1]}</h3><p>${r[2]}</p><div class="callout">${r[3]}</div></div>`).join('')}</div><div class="card" style="margin-top:20px"><h2>每周复盘</h2><textarea aria-label="每周复盘" placeholder="本周完成了什么？哪里仍不确定？下周交付什么？" oninput="state.notes.week=this.value;save()">${esc(state.notes.week||'')}</textarea></div>`;
if(page==='cases')html=head('把知识，变成可交付的案例','四个贴近工作的练习。从分析设计开始，形成可解释的建议。')+`<div class="grid">${cases.map((c,i)=>`<div class="card"><div class="row"><span class="tag">${c[2]}</span><span class="tiny">CASE 0${i+1}</span></div><h3>${c[1]}</h3><p>${c[3]}</p><div class="row" style="margin-top:22px"><span class="tiny">${state.done[c[0]]?'✓ 已完成复盘':state.answers[c[0]]?'已保存草稿':'待开始'}</span><button class="btn" onclick="caseDetail('${c[0]}')">进入练习 →</button></div></div>`).join('')}</div>`;
if(page==='review'){let qs=['如何解释 NCA 与 PopPK 的用途和限制？','如何评价模型是否适合支持当前剂量决策？','讲述一次 CPAP / CSR review 中识别问题的经历。','如何把 TIM / dissolution 数据连接到 PBPK，并处理不确定性？','用 STAR 讲述一次跨团队分歧，以及你的科学依据。','如果担任项目 lead，你会如何定义交付物、风险与质量标准？'];html=head('复习与面试准备','能解释、能复现、能支持决策，才算真正掌握。')+`<div class="dashboard"><div class="card"><h2>面试题卡</h2>${qs.map((q,i)=>`<details style="padding:15px 0;border-bottom:1px solid var(--line)"><summary>${q}</summary><p class="tiny">回答结构：场景 → 方法与理由 → 结果 → 局限 → 决策影响。用真实经历和可核实的证据。</p><textarea aria-label="面试回答 ${i+1}" oninput="state.answers['q${i}']=this.value;save()" placeholder="写下你的回答要点…">${esc(state.answers['q'+i]||'')}</textarea></details>`).join('')}</div><div class="card"><h2>交付前复习清单</h2>${[['v1','我能解释关键参数和方法假设','基础理解'],['v2','我能从数据重新生成结果','可复现性'],['v3','我记录了版本、来源和 QC','ALCOA+'],['v4','我说明了不确定性与局限','科学解释'],['v5','我的结论回应了研究问题','决策价值'],['v6','我准备了 2 分钟项目介绍','面试表达']].map(task).join('')}</div></div>`}
document.getElementById('app').innerHTML=html;if(page==='library')resourceList()}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><span class="eyebrow">PK ATLAS / WORKSPACE</span><button aria-label="关闭" onclick="closeModal()">✕</button></div>${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML='';render()}function pathDetail(id){let p=paths.find(p=>p.id===id);modal(`<h1>${p.name}</h1><p>${p.desc}</p><div class="callout"><b>目标交付物</b><p>${p.deliver}</p></div>${p.mods.map((m,i)=>`<div class="task"><input type="checkbox" aria-label="完成 ${esc(m)}" ${state.done[id+i]?'checked':''} onchange="state.done['${id+i}']=this.checked;save()"><label>${m}<small>完成标准：解释方法、完成实践，并留下笔记或输出证据。</small></label></div>`).join('')}<h3>学习笔记与证据</h3><textarea aria-label="学习笔记" placeholder="记录文献、版本、练习结果、问题与交付物位置…" oninput="state.notes['${id}']=this.value;save()">${esc(state.notes[id]||'')}</textarea><button class="btn primary" style="margin-top:15px" onclick="closeModal();notify()">保存并返回</button>`)}
function resourceList(){let all=[...resources,...state.resources].filter(r=>(filter==='全部'||r[2]===filter)&&r.join(' ').toLowerCase().includes(search.toLowerCase()));document.getElementById('resources').innerHTML=all.length?all.map(r=>`<div class="card resource"><div class="row"><div><span class="tag">${esc(r[2])}</span><span class="tiny" style="margin-left:10px">${esc(r[3])}</span><h3>${esc(r[1])}</h3><p>${esc(r[4])}</p>${/^https?:\/\//.test(r[5])?`<a href="${esc(r[5])}" target="_blank" rel="noopener">打开资源 ↗</a>`:''}</div><select aria-label="${esc(r[1])} 学习状态" onchange="state.notes['status${r[0]}']=this.value;save()">${['未开始','学习中','已完成','待复习'].map(s=>`<option ${state.notes['status'+r[0]]===s?'selected':''}>${s}</option>`).join('')}</select></div><details style="margin-top:10px"><summary class="tiny">学习笔记 / 版本记录</summary><textarea aria-label="资源笔记" oninput="state.notes['res${r[0]}']=this.value;save()">${esc(state.notes['res'+r[0]]||'')}</textarea></details></div>`).join(''):'<div class="empty">没有匹配的资源。尝试其他关键词，或添加自己的学习资料。</div>'}
function addResource(){modal(`<h1>添加学习资源</h1><form onsubmit="event.preventDefault();submitResource(this)"><p>标题</p><input required name="title" style="width:100%" placeholder="资源标题"><p>类型与主题</p><div class="row"><select name="type">${['书籍','文献','视频','指南','文档','SOP','case study'].map(s=>`<option>${s}</option>`).join('')}</select><select name="topic">${paths.map(p=>`<option>${p.name}</option>`).join('')}</select></div><p>学习目标 / 作者 / 版本</p><textarea name="desc"></textarea><p>链接（可选）</p><input name="url" type="url" style="width:100%" placeholder="https://…"><button class="btn primary" style="margin-top:20px">保存资源</button></form>`)}function submitResource(f){let d=new FormData(f);state.resources.push(['r'+Date.now(),d.get('title'),d.get('type'),d.get('topic'),d.get('desc'),d.get('url')]);save();closeModal();notify()}
function addTask(){modal(`<h1>添加本周任务</h1><form onsubmit="event.preventDefault();let f=new FormData(this);state.tasks.push(['t'+Date.now(),f.get('title'),f.get('desc')]);save();closeModal();notify()"><input required name="title" placeholder="具体任务与交付物" style="width:100%"><input name="desc" placeholder="主题、预计时长或截止时间" style="width:100%;margin:14px 0"><button class="btn primary">保存任务</button></form>`)}function caseDetail(id){let c=cases.find(c=>c[0]===id);modal(`<span class="tag">${c[2]}</span><h1>${c[1]}</h1><p>${c[3]}</p><h3>你的分析与决策</h3><textarea style="min-height:160px" aria-label="案例回答" placeholder="写下研究问题、方法、假设、QC、局限与建议…" oninput="state.answers['${id}']=this.value;save()">${esc(state.answers[id]||'')}</textarea><details style="margin:20px 0"><summary>查看参考思路与自检要点</summary><ul>${c[4].map(s=>`<li>${s}</li>`).join('')}</ul><p class="tiny">此为教学场景；实际分析需遵循 study protocol、CPAP 和获批流程。</p></details><label><input type="checkbox" ${state.done[id]?'checked':''} onchange="state.done['${id}']=this.checked;save()"> 已完成练习并复盘</label><br><button class="btn primary" style="margin-top:15px" onclick="closeModal();notify()">保存练习</button>`)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pk-atlas-progress.json';a.click();URL.revokeObjectURL(a.href);notify('学习备份已导出')}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!x.done||!x.notes||!Array.isArray(x.resources)||!Array.isArray(x.tasks))throw Error();if(!confirm('导入将替换当前学习记录，建议先导出备份。继续？'))return;state={...initial,...x};save();render();notify('学习记录已恢复')}catch{notify('文件格式不正确，请选择 PK Atlas 备份')}})}render();
</script></body></html>
